name: Enkodu
targets:
  Enkodu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Enkodu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enkodu.companion
        INFOPLIST_FILE: Enkodu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
    entitlements:
      path: Enkodu/Enkodu.entitlements
      properties:
        com.apple.developer.background-task: true
        com.apple.developer.networking.wifi-info: true
    dependencies:
      - framework: VideoToolbox.framework
      - framework: AVFoundation.framework
      - framework: Photos.framework
      - framework: UserNotifications.framework

schemes:
  Enkodu:
    build:
      targets:
        Enkodu: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - Enkodu
