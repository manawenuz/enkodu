[package]
name = "enkodu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "enkodu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
dirs = "5"
env_logger = "0.11"
hex = "0.4"
indicatif = "0.17"
log = "0.4"
muda = "0.15"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tiny_http = "0.12"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tray-icon = "0.19"
tungstenite = { version = "0.24", features = ["native-tls"] }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
