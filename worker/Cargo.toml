[package]
name = "yulia-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yulia-worker"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = 3
