when:
  - event: push
    branch: main
  - event: tag
    ref: refs/tags/v*

variables:
  - &registry    git.tbs.amn.gg
  - &image       git.tbs.amn.gg/manawenuz/enkodu
  - &arcane_env  5554b43c-0265-4fdb-bb49-2314102e2c0f
  - &project_id  8db2aeb6-a244-410f-8601-8a8acac21865

steps:
  - name: build-worker-windows
    image: debian:bookworm-slim
    failure: ignore
    environment:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    commands:
      - |
        set -e
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev gcc-mingw-w64-x86-64
        rm -rf /var/lib/apt/lists/*

        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain stable --target x86_64-pc-windows-gnu
        . "$HOME/.cargo/env"

        [ -f worker/Cargo.toml ] || { echo "worker/ not in repo yet — skipping"; exit 0; }
        cd worker
        cargo build --locked --release --target x86_64-pc-windows-gnu

        mkdir -p ../dist
        cp target/x86_64-pc-windows-gnu/release/yulia-worker.exe ../dist/yulia-worker-windows-x86_64.exe
        (cd ../dist && sha256sum yulia-worker-windows-x86_64.exe > yulia-worker-windows-x86_64.exe.sha256)
        ls -lh ../dist

  - name: build-queue-image-push
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: *registry
      repo: *image
      tags:
        - "${CI_COMMIT_SHA}"
        - main
      username:
        from_secret: forgejo_user
      password:
        from_secret: forgejo_token
      platforms: linux/arm64
      dockerfile: queue/Dockerfile
      context: queue/
      timeout: 30m
      cache_from: "git.tbs.amn.gg/manawenuz/enkodu:buildcache"
      cache_to: "git.tbs.amn.gg/manawenuz/enkodu:buildcache"
    when:
      - event: push
        branch: main

  - name: build-queue-image-release
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: *registry
      repo: *image
      tags:
        - "${CI_COMMIT_TAG##v}"
      username:
        from_secret: forgejo_user
      password:
        from_secret: forgejo_token
      platforms: linux/arm64
      dockerfile: queue/Dockerfile
      context: queue/
      timeout: 30m
      cache_from: "type=registry,ref=git.tbs.amn.gg/manawenuz/enkodu:buildcache"
    when:
      - event: tag
        ref: refs/tags/v*

  - name: deploy
    image: alpine
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
      ARCANE_ENV: 5554b43c-0265-4fdb-bb49-2314102e2c0f
      ARCANE_PROJECT: 8db2aeb6-a244-410f-8601-8a8acac21865
      IMAGE: git.tbs.amn.gg/manawenuz/enkodu
    commands:
      - |
        set -e
        apk add --no-cache openssh-client

        mkdir -p /root/.ssh
        printf '%s' "$DEPLOY_SSH_KEY" > /root/.ssh/id_ed25519
        chmod 600 /root/.ssh/id_ed25519
        ssh-keyscan -H 89.58.32.32 >> /root/.ssh/known_hosts 2>/dev/null

        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          VER="${CI_COMMIT_TAG##v}"
        else
          VER="$CI_COMMIT_SHA"
        fi

        echo "→ Deploying enkodu:$VER via arcane-cli on Arcane server"
        sed "s|$IMAGE:[^ ]*|$IMAGE:$VER|g" docker-compose.yml > /tmp/compose-deploy.yml

        scp -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
          /tmp/compose-deploy.yml root@89.58.32.32:/tmp/enkodu-compose.yml

        ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@89.58.32.32 \
          "arcane-cli --env $ARCANE_ENV projects update $ARCANE_PROJECT --file /tmp/enkodu-compose.yml \
           && arcane-cli --env $ARCANE_ENV projects redeploy $ARCANE_PROJECT \
           && echo '✓ enkodu:$VER deployed'"
    when:
      - event: push
        branch: main
      - event: tag
        ref: refs/tags/v*
